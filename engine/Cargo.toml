[workspace]
resolver = "3"
members = [
    "crates/corpus",
    "crates/pubread",
    "crates/labels",
    "crates/metrics",
    "crates/publish",
    "crates/ledger",
    "crates/select_v2",
]

[workspace.package]
edition = "2024"
rust-version = "1.97.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
