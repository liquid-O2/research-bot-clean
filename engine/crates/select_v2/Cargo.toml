[package]
name = "select_v2"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "select_v2"
path = "src/main.rs"

[dependencies]
# The 1,003-session registry, `SessionClock` (the sole lawful naive-ET(frame B)
# <-> UTC(frame A) boundary) and the source-profile enum. This crate REUSES
# them; it never re-derives a session window or a second 09:30 anchor.
corpus = { path = "../corpus" }
# Pinned to the versions the workspace already resolved, so `Cargo.lock` keeps
# ONE arrow/parquet resolution (same convention `select`/`publish` document).
arrow-array = "=59.1.0"
arrow-schema = "=59.1.0"
parquet = { version = "=59.1.0", default-features = false, features = ["arrow", "zstd"] }
# Per-session parallelism in the emit driver. Sessions share no mutable state,
# so the pass is embarrassingly parallel. Same version already resolved.
rayon = "1.10"
clap = { version = "4.6.3", features = ["derive"] }
